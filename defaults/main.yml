---
# Default timezone
timezone: "Etc/UTC"

timezone_dependent_services_map:
  RedHat:
    - "crond"
    - "rsyslog"
  Rocky:
    - "crond"
    - "rsyslog"
  Debian:
    - "cron"
    - "rsyslog"

__timezone_dependent_services_raw: "{{ timezone_dependent_services_map[ansible_distribution] | default(timezone_dependent_services_map[ansible_os_family] | default(timezone_dependent_services_map['default'])) }}"

# rsyslog isn't installed by default on EL10+ (RHEL is moving to
# journald), so drop it from the restart list there instead of failing
# on a service that was never there to begin with.
timezone_dependent_services: >-
  {{ __timezone_dependent_services_raw | reject('equalto', 'rsyslog') | list
     if (ansible_os_family == 'RedHat' and ansible_distribution_major_version | int >= 10)
     else __timezone_dependent_services_raw }}
